<body>

<header class="nav">
  <a class="logo" href="#profil" aria-label="Pengangguran Indonesia — beranda">
    <span class="tanda" aria-hidden="true">
      <svg class="ikon-logo" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="4.5" y="15" width="3.8" height="8" rx="1.4" fill="#99f6e4" fill-opacity="0.55"/>
        <rect x="11.6" y="10.5" width="3.8" height="12.5" rx="1.4" fill="#5eead4" fill-opacity="0.82"/>
        <rect x="18.7" y="6.5" width="3.8" height="16.5" rx="1.4" fill="#ffffff"/>

<main id="utama">
  <section id="page-beranda" class="page"><div class="isi" id="beranda"></div></section>

  <section id="page-peta" class="page" aria-label="Peta">
    <div class="peta-host" id="peta"></div>
    <div class="mengapung rel" id="rel">
      <section><h2>Lapisan peta</h2><div class="lap" id="lapisan" role="radiogroup" aria-label="Lapisan peta"></div></section>
      <section><h2>Tingkat wilayah</h2><div class="seg" id="seg-level"></div></section>
      <section><h2>Frekuensi</h2><div class="seg" id="seg-frek"></div></section>
      <section class="tambahan"><button class="btn" id="btn-tabel" type="button" style="width:100%;justify-content:center"><svg class="ikon" viewBox="0 0 24 24"><path d="M3 5h18v14H3zM3 10h18M9 10v9"/></svg>Tabel &amp; unduh CSV</button></section>
    </div>
    <div class="mengapung zoom-alat" role="group" aria-label="Kontrol peta">
      <button type="button" id="z-plus" aria-label="Perbesar" title="Perbesar">+</button>
      <button type="button" id="z-minus" aria-label="Perkecil" title="Perkecil">−</button>
      <button type="button" id="z-home" aria-label="Seluruh Indonesia" title="Seluruh Indonesia"><svg class="ikon" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg></button>
      <button type="button" id="z-full" aria-label="Layar penuh" title="Layar penuh"><svg class="ikon" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button type="button" id="z-guide" aria-label="Panduan peta" title="Panduan cara menjelajahi peta"><svg class="ikon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></button>
    </div>
    <div class="mengapung legenda-apung" id="legenda"></div>
    <div class="mengapung waktu" id="waktu"></div>
    <aside class="mengapung panel" id="panel" aria-label="Panel analisis">
      <button class="pegangan" id="pegangan" type="button" aria-label="Buka/tutup panel"></button>
      <div class="kepala"><div class="cari" id="cari"></div></div>
      <div class="badan" id="panel-badan"></div>
    </aside>
    <dialog class="laci" id="laci">
      <div class="kepala"><div><b id="laci-judul"></b><div class="kecil" id="laci-sub"></div></div>
        <div style="display:flex;gap:8px"><button class="btn utama" id="laci-csv" type="button">Unduh CSV (seluruh periode)</button><button class="btn" id="laci-tutup" type="button">Tutup</button></div></div>
      <div class="badan" id="laci-badan"></div>
    </dialog>
  </section>

  <section id="page-profil" class="page"><div class="isi" id="profil"></div></section>
  <section id="page-sasaran" class="page"><div class="isi" id="sasaran"></div></section>
  <section id="page-insight" class="page"><div class="isi story" id="insight"></div></section>
  <section id="page-metode" class="page"><div class="isi" id="metode"></div></section>
</main>
<footer class="kaki" id="kaki"></footer>
