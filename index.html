<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pengangguran Indonesia</title>
<meta name="description" content="Dashboard pengangguran Indonesia versi 2: TPT provinsi 2015–2026 dan 514 kabupaten/kota, NEET, setengah pengangguran, jumlah penganggur, sasaran RPJMN 2025–2029 — angka resmi BPS, Kemnaker, Bappenas.">
<link rel="icon" type="image/png" href="assets/logo-bappenas.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/inti.css">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="v2_theme.css">
<link rel="stylesheet" href="v2_layout.css">
<link rel="stylesheet" href="v2_minimalist_map.css">
</head>
<body>
<a class="lewati" href="#utama">Lewati ke konten</a>
<header class="nav">
  <a class="logo" href="#profil" aria-label="Pengangguran Indonesia — beranda">
    <span class="tanda" aria-hidden="true">
      <img class="ikon-logo" src="assets/logo-bappenas.png" alt="Logo Kementerian PPN/Bappenas" width="28" height="28">
    </span>
    <span class="brand">
      <b>Pengangguran Indonesia</b>
      <span class="brand-sub">Observatorium Data Ketenagakerjaan · BPS &amp; RPJMN</span>
    </span>
  </a>
  <nav class="tabs" role="tablist" aria-label="Halaman">
    <button role="tab" data-page="peta" title="Peta Spasial (P)"><svg class="ikon" viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg><span class="tx">Peta</span></button>
    <button role="tab" data-page="profil" title="Profil Wilayah &amp; Nasional (R)"><svg class="ikon" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg><span class="tx">Profil Wilayah</span></button>
    <button role="tab" data-page="sasaran" title="Sasaran RPJMN (S)"><svg class="ikon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg><span class="tx">Sasaran RPJMN</span></button>
    <button role="tab" data-page="insight" title="Informasi, Cerita &amp; Milestone (I)"><svg class="ikon" viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 1 4 12.7V17a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1v-2.3A7 7 0 0 1 12 2zM9 21h6"/></svg><span class="tx">Informasi</span></button>
  </nav>
  <div class="nav-aksi" style="display:flex;align-items:center;gap:8px">
    <button id="btn-metode" class="btn-nav-page btn-icon" type="button" data-page="metode" title="Metodologi &amp; Unduh Data (M)" aria-label="Metodologi">
      <svg class="ikon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    </button>
    <button id="btn-fullscreen" class="tema btn-icon" type="button" title="Layar Penuh (F11)" aria-label="Layar Penuh">
      <svg class="ikon ikon-fs-buka" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      <svg class="ikon ikon-fs-tutup" viewBox="0 0 24 24" style="display:none"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
    </button>
    <button id="tema" class="tema btn-icon" type="button" title="Ganti tema terang/gelap" aria-label="Ganti tema">
      <svg class="ikon ikon-tema-terang" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="ikon ikon-tema-gelap" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
</header>

<main id="utama">
  <section id="page-beranda" class="page"><div class="isi" id="beranda"></div></section>

  <section id="page-peta" class="page" aria-label="Peta">
    <div class="peta-host" id="peta"></div>
    <div class="mengapung rel" id="rel">
      <section><h2>Lapisan peta</h2><div class="lap" id="lapisan" role="radiogroup" aria-label="Lapisan peta"></div></section>
      <section><h2>Tingkat wilayah</h2><div class="seg" id="seg-level"></div></section>
      <section><h2>Frekuensi</h2><div class="seg" id="seg-frek"></div></section>
      <section class="tambahan"><button class="btn" id="btn-tabel" type="button" style="width:100%;justify-content:center"><svg class="ikon" viewBox="0 0 24 24"><path d="M3 5h18v14H3zM3 10h18M9 10v9"/></svg>Tabel &amp; unduh CSV</button></section>
    </div>
    <div class="mengapung zoom-alat" role="group" aria-label="Kontrol peta">
      <button type="button" id="z-plus" aria-label="Perbesar" title="Perbesar">+</button>
      <button type="button" id="z-minus" aria-label="Perkecil" title="Perkecil">−</button>
      <button type="button" id="z-home" aria-label="Seluruh Indonesia" title="Seluruh Indonesia"><svg class="ikon" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg></button>
      <button type="button" id="z-full" aria-label="Layar penuh" title="Layar penuh"><svg class="ikon" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button type="button" id="z-guide" aria-label="Panduan peta" title="Panduan cara menjelajahi peta"><svg class="ikon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></button>
    </div>
    <div class="mengapung legenda-apung" id="legenda"></div>
    <div class="mengapung waktu" id="waktu"></div>
    <aside class="mengapung panel" id="panel" aria-label="Panel analisis">
      <button class="pegangan" id="pegangan" type="button" aria-label="Buka/tutup panel"></button>
      <div class="kepala"><div class="cari" id="cari"></div></div>
      <div class="badan" id="panel-badan"></div>
    </aside>
    <dialog class="laci" id="laci">
      <div class="kepala"><div><b id="laci-judul"></b><div class="kecil" id="laci-sub"></div></div>
        <div style="display:flex;gap:8px"><button class="btn utama" id="laci-csv" type="button">Unduh CSV (seluruh periode)</button><button class="btn" id="laci-tutup" type="button">Tutup</button></div></div>
      <div class="badan" id="laci-badan"></div>
    </dialog>
  </section>

  <section id="page-profil" class="page"><div class="isi" id="profil"></div></section>
  <section id="page-sasaran" class="page"><div class="isi" id="sasaran"></div></section>
  <section id="page-insight" class="page"><div class="isi story" id="insight"></div></section>
  <section id="page-metode" class="page"><div class="isi" id="metode"></div></section>
</main>
<footer class="kaki" id="kaki"></footer>
<div class="tip" id="tip" role="status" aria-live="polite"></div>

<!-- data sebagai berkas .js agar dapat dibuka langsung (file://) tanpa server -->
<script src="data/wilayah.js"></script>
<script src="data/pengangguran.js"></script>
<script src="assets/inti.js"></script>
<script src="assets/app.js"></script>
<script src="v2_enhancements.js"></script>
</body>
</html>
